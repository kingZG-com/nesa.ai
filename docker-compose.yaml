# ═══════════════════════════════════════════════════════════════════
#  docker-compose.yaml (Auto-Build Version)
#  Stack : OpenLiteSpeed + lsphp84 + FrankenPHP + Laravel
#  DB    : PostgreSQL 16 (Alpine)
#  WS    : Laravel Reverb (port 8080)
# ═══════════════════════════════════════════════════════════════════

name: laravel-ols

services:

  # ── Laravel Application (OLS + lsphp84 + FrankenPHP) ──────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "24"
    # 🔥 TRICK 1: Ubah tag image jadi unik (misal v1) tiap ada perombakan besar, 
    # atau apus baris 'image' ini biar dia ga nge-cache nama image yang sama terus.
    image: laravel-nginx:v1
    container_name: laravel_nginx_image
    restart: unless-stopped

    # 🔥 TRICK 2: Selalu rebuild image dari Dockerfile lokal (no cache pull)
    pull_policy: never

    ports:
      - "8088:8088"         # Nginx HTTP
      - "8080:8080"         # Laravel Reverb WebSocket

    environment:
      # ── Laravel Core ──────────────────────────────────────────
      APP_NAME: "${APP_NAME:-EDUPATH}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost:8088}"

      # ── Database (PostgreSQL) ─────────────────────────────────
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-smartnes_db}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"

      # ── Cache / Session / Queue ────────────────────────────────────────
      CACHE_DRIVER: "${CACHE_DRIVER:-database}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"

      # ── Laravel Reverb (WebSocket) ────────────────────────────────
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${REVERB_APP_ID:-299933}"
      REVERB_APP_KEY: "${REVERB_APP_KEY:-he8bcpfzutuocd13xmn8}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET:-jhngsp0l5ees3a8n2kip}"
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: 8080
      REVERB_SCHEME: http

      # ── OLS Behavior ────────────────────────────────────────────
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-false}"

    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
      - nginx_logs:/var/log/nginx

    depends_on:
      db:
        condition: service_healthy

    networks:
      - app_network

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    deploy:
      resources:
        limits:
          memory: 768M

  # ── PostgreSQL 16 Database ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: laravel_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${DB_DATABASE:-smartnes_db}"
      POSTGRES_USER: "${DB_USERNAME:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
      PGDATA: /var/lib/postgresql/data/pgdata

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - app_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-smartnes_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

# ── Named Volumes ──────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  app_storage:
    driver: local
  app_logs:
    driver: local
  nginx_logs:
    driver: local

# ── Networks ───────────────────────────────────────────────────
networks:
  app_network:
    driver: bridge
    name: laravel_ols_network