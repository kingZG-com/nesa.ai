# ═══════════════════════════════════════════════════════════════════
#  OpenLiteSpeed 1.8.5 — Main Server Configuration
#  - PHP Handler : lsphp83 via LSAPI (native OLS integration)
#  - FrankenPHP  : Available as alternative extApp (see commented block)
#  - Port        : 8088 (OLS default HTTP)
# ═══════════════════════════════════════════════════════════════════

# ── Server Identity ─────────────────────────────────────────────
serverName                localhost
user                      nobody
group                     nogroup
priority                  0
inMemBufSize              60M
swappingDir               /tmp/lshttpd/swapping
autoFix503                1
gracefulRestartTimeout    300
mime                      conf/mime.properties
showVersionNumber         0
adminEmails               root@localhost
enableCoreDump            0
indexFiles                index.php, index.html
autoIndex                 0

# ── Performance Tuning ──────────────────────────────────────────
maxConnections            10000
maxSSLConnections         10000
connTimeout               300
maxKeepAliveReq           10000
smartKeepAlive            1
keepAliveTimeout          5
sndBufSize                0
rcvBufSize                0
maxReqURLLen              32768
maxReqHeaderSize          65536
maxReqBodySize            2047M
maxDynRespHeaderSize      32768
maxDynRespSize            2047M

# ── Compression ─────────────────────────────────────────────────
enableGzipCompress        1
enableBrCompress          4
compressibleTypes         default
enableDynGzipCompress     1
gzipCompressLevel         6
brCompressLevel           4
gzipAutoUpdateStatic      1
gzipStaticCompressLevel   6
brStaticCompressLevel     4
gzipMaxFileSize           10M
gzipMinFileSize           300

# ── Static File Cache ───────────────────────────────────────────
maxCachedFileSize         4096
totalInMemCacheSize       20M
maxMMapFileSize           256K
totalMMapCacheSize        40M
useSendfile               1
fileETag                  28

# ── Logging ─────────────────────────────────────────────────────
errorlog logs/error.log {
  useServer               1
  logLevel                ERROR
  rollingSize             10M
  keepDays                7
  compressArchive         1
}

accesslog logs/access.log {
  useServer               0
  logFormat               "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
  logHeaders              5
  rollingSize             10M
  keepDays                7
  compressArchive         1
}

# ── PHP LSAPI External Application — lsphp83 (PRIMARY) ─────────
# OLS native LSAPI integration using lsphp83 (PHP 8.3 + LiteSpeed SAPI)
extapp lsapi lsphp83 {
  type                    lsapi
  address                 uds:///tmp/lshttpd/lsphp83.sock
  maxConns                35
  env                     PHP_LSAPI_CHILDREN=35
  env                     LSAPI_AVOID_FORK=200M
  initTimeout             60
  retryTimeout            0
  pcKeepAliveTimeout      300
  respBuffer              0
  autoStart               1
  path                    /usr/local/lsws/lsphp83/bin/lsphp
  backlog                 100
  instances               1
  extMaxIdleTime          300
  priority                0
  memSoftLimit            2047M
  memHardLimit            2047M
  procSoftLimit           1400
  procHardLimit           1500
}

# ── PHP LSAPI External Application — FrankenPHP (ALTERNATIVE) ───
# Uncomment this block and change scripthandler below to use FrankenPHP
# as the LSAPI handler instead of lsphp83. FrankenPHP binary embeds PHP 8.3.
#
# extapp lsapi FrankenPHP {
#   type                    lsapi
#   address                 uds:///tmp/lshttpd/frankenphp.sock
#   maxConns                35
#   env                     PHP_LSAPI_CHILDREN=35
#   env                     FRANKENPHP_NO_HTTP_SERVER=1
#   initTimeout             60
#   retryTimeout            0
#   pcKeepAliveTimeout      300
#   respBuffer              0
#   autoStart               1
#   path                    /usr/local/bin/frankenphp
#   backlog                 100
#   instances               1
#   extMaxIdleTime          300
#   priority                0
#   memSoftLimit            2047M
#   memHardLimit            2047M
# }

# ── Script Handler (maps .php files → PHP extApp) ───────────────
# To switch to FrankenPHP, change lsapi:lsphp83 → lsapi:FrankenPHP
scripthandler {
  add                     lsapi:lsphp83 php
}

# ── Virtual Host Definition ─────────────────────────────────────
virtualhost html {
  vhRoot                  /var/www/html
  configFile              conf/vhosts/html/vhconf.conf
  allowSymbolLink         1
  enableScript            1
  restrained              0
  setUIDMode              0
}

# ── Listener: Port 8088 (OLS Default) ───────────────────────────
listener Default {
  address                 *:8088
  secure                  0
  map                     html *
}
