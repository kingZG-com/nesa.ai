# ═══════════════════════════════════════════════════════════════════
#  OpenLiteSpeed — Virtual Host Configuration
#  App     : Laravel (document root = /var/www/html/public)
#  Handler : lsphp83 via LSAPI
#  Rewrite : Laravel pretty-URL fallback to index.php
# ═══════════════════════════════════════════════════════════════════

# Document root points to Laravel's public/ directory
docRoot                   $VH_ROOT/public
vhDomain                  localhost
enableGzip                1
enableBr                  1
cgroups                   0

# ── Virtual Host Logging ────────────────────────────────────────
errorlog logs/vh_error.log {
  useServer               0
  logLevel                ERROR
  rollingSize             10M
  keepDays                7
}

accesslog logs/vh_access.log {
  useServer               0
  logFormat               "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\""
  logHeaders              5
  rollingSize             10M
  keepDays                7
}

# ── Directory Index ─────────────────────────────────────────────
index {
  useServer               0
  indexFiles              index.php, index.html
  autoIndex               0
}

# ── PHP Script Handler (inherits from server if not set here) ───
scripthandler {
  add                     lsapi:lsphp83 php
}

# ── PHP ini Overrides ───────────────────────────────────────────
phpIniOverride {
  php_admin_value  upload_max_filesize  64M
  php_admin_value  post_max_size        64M
  php_admin_value  max_execution_time   300
  php_admin_value  memory_limit         256M
  php_admin_value  display_errors       Off
  php_admin_value  log_errors           On
}

# ── Laravel Context — URL rewriting ────────────────────────────
# All requests that don't match a real file/directory
# are routed to index.php (Laravel's front controller)
context / {
  type                    NULL
  location                $DOC_ROOT
  allowBrowse             1

  rewrite {
    enable                1
    rules                 <<<END_rules
RewriteEngine On

# Block direct access to sensitive files
RewriteRule ^(\.env|composer\.(json|lock)|package\.json|webpack\.mix\.js)$ - [F,L]

# Static files — serve directly
RewriteCond %{REQUEST_FILENAME} -f [OR]
RewriteCond %{REQUEST_FILENAME} -d
RewriteRule ^ - [L]

# Everything else → Laravel front controller
RewriteRule ^ index.php [L]
    END_rules
  }
}

# ── Rewrite — auto-load .htaccess ───────────────────────────────
rewrite {
  enable                  1
  autoLoadHtaccess        1
}

# ── Security: Deny access to hidden files (e.g. .env, .git) ────
context /.* {
  type                    NULL
  location                $DOC_ROOT/.*
  allowBrowse             0
}

# ── Static Asset Caching (CSS, JS, images) ──────────────────────
context /build {
  type                    NULL
  location                $DOC_ROOT/build
  allowBrowse             1
  expires                 A604800
  setHeaders              Cache-Control: public, max-age=604800
}

context /storage {
  type                    NULL
  location                $DOC_ROOT/storage
  allowBrowse             1
  expires                 A86400
}
